name: Actualizar alertas SENAPRED

# Revisa el sitio oficial de SENAPRED y actualiza alerts.json solo si hay cambios.
# Horario: 07:58, 13:58 y 19:58 de Chile continental (UTC-3).
on:
  schedule:
    # GitHub atrasa y a veces se salta las tareas programadas: con tres horarios
    # al dia llegaron a pasar 19 horas entre una revision y la siguiente. Con uno
    # cada tres horas, aunque se pierdan algunos, el hueco se mantiene corto.
    # El minuto 23 evita la hora en punto, que es cuando mas carga tiene GitHub.
    - cron: "23 1,4,7,10,13,16,19,22 * * *"
  workflow_dispatch:
    inputs:
      prueba_correo:
        description: "Enviar un correo de prueba a los destinatarios (no revisa SENAPRED)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  # SENAPRED publica en hora de Chile continental; el servidor de GitHub usa UTC.
  TZ: America/Santiago

concurrency:
  group: alertas-senapred
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probar los avisos por correo
        if: inputs.prueba_correo
        env:
          SMTP_USUARIO: ${{ secrets.SMTP_USUARIO }}
          SMTP_CLAVE: ${{ secrets.SMTP_CLAVE }}
          DESTINATARIOS: ${{ secrets.DESTINATARIOS }}
          SMTP_SERVIDOR: ${{ vars.SMTP_SERVIDOR }}
          SMTP_PUERTO: ${{ vars.SMTP_PUERTO }}
          PAGINA_URL: https://paulinaalmonacid-lang.github.io/alertas-hsec-chile/
        run: python tools/avisar_correo.py --prueba

      - name: Instalar el navegador que lee SENAPRED
        if: ${{ !inputs.prueba_correo }}
        run: |
          python -m pip install --upgrade pip
          pip install "playwright==1.47.0"
          python -m playwright install --with-deps chromium

      - name: Leer SENAPRED
        if: ${{ !inputs.prueba_correo }}
        run: |
          python tools/senapred_scraper.py \
            --previous alerts.json \
            --comunas tools/comunas_cl.json \
            --out candidato.json \
            --changes-out cambios.json

      - name: Aplicar los cambios si los hay
        if: ${{ !inputs.prueba_correo }}
        id: aplicar
        run: python tools/aplicar_cambios.py alerts.json candidato.json

      - name: Anotar el historial por comuna
        if: steps.aplicar.outputs.changed == 'true'
        run: python tools/historial.py --alerts alerts.json --out historial.json

      - name: Avisar por correo a las personas inscritas
        if: steps.aplicar.outputs.changed == 'true'
        env:
          SMTP_USUARIO: ${{ secrets.SMTP_USUARIO }}
          SMTP_CLAVE: ${{ secrets.SMTP_CLAVE }}
          DESTINATARIOS: ${{ secrets.DESTINATARIOS }}
          SMTP_SERVIDOR: ${{ vars.SMTP_SERVIDOR }}
          SMTP_PUERTO: ${{ vars.SMTP_PUERTO }}
          PAGINA_URL: https://paulinaalmonacid-lang.github.io/alertas-hsec-chile/
        run: python tools/avisar_correo.py cambios.json

      - name: Guardar en el repositorio
        if: steps.aplicar.outputs.changed == 'true'
        run: |
          rm -f candidato.json cambios.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alerts.json historial.json
          git commit -m "Alertas SENAPRED actualizadas automaticamente"
          git push
